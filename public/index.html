<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stoia Mail</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="app">

    <!-- Header / Account Tabs -->
    <header id="header">
      <div class="header-brand">
        <span class="brand-icon">✉</span>
        <span class="brand-name">Stoia Mail</span>
      </div>
      <div id="account-tabs" class="account-tabs"></div>
      <div class="header-actions">
        <button id="btn-compose" class="btn-gold" title="Compose">
          <span>✏</span> Compose
        </button>
        <button id="btn-settings" class="btn-icon" title="Settings">⚙</button>
      </div>
    </header>

    <!-- Main Layout -->
    <div id="main">

      <!-- Folder Sidebar -->
      <aside id="sidebar">
        <div class="sidebar-header">Folders</div>
        <div id="folder-list" class="folder-list">
          <div class="loading-spinner">Loading...</div>
        </div>
        <button id="btn-refresh" class="btn-sidebar-refresh">↻ Refresh</button>
      </aside>

      <!-- Email List -->
      <section id="email-list-panel">
        <div class="panel-header">
          <span id="folder-title">INBOX</span>
          <span id="email-count" class="email-count"></span>
        </div>
        <!-- Filter Bar -->
        <div id="filter-bar" class="filter-bar">
          <input type="text" id="filter-search" class="filter-search" placeholder="🔍 Search subject or sender…">
          <button id="filter-unread" class="filter-btn" title="Unread only">Unread</button>
          <select id="filter-date" class="filter-select">
            <option value="all">All time</option>
            <option value="today">Today</option>
            <option value="week">This Week</option>
            <option value="month">This Month</option>
          </select>
          <button id="filter-clear" class="filter-btn filter-clear-btn" title="Clear filters">✕</button>
        </div>
        <div id="email-list" class="email-list">
          <div class="empty-state">Select a folder to load emails</div>
        </div>
      </section>

      <!-- Email Reader -->
      <section id="email-reader-panel">
        <div id="email-reader" class="email-reader">
          <div class="empty-state reader-empty">
            <div class="empty-icon">✉</div>
            <p>Select an email to read</p>
          </div>
        </div>
      </section>

    </div><!-- /#main -->

  </div><!-- /#app -->

  <!-- Compose Modal -->
  <div id="modal-compose" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-box">
      <div class="modal-header">
        <span>New Message</span>
        <button class="modal-close" data-close="modal-compose">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>To</label>
          <input type="text" id="compose-to" placeholder="recipient@example.com">
        </div>
        <div class="form-group">
          <label>CC</label>
          <input type="text" id="compose-cc" placeholder="optional">
        </div>
        <div class="form-group">
          <label>Subject</label>
          <input type="text" id="compose-subject" placeholder="Subject">
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea id="compose-body" rows="12" placeholder="Write your message..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-send" class="btn-gold">Send ✈</button>
        <button class="btn-ghost" data-close="modal-compose">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="modal-settings" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-box modal-box-lg">
      <div class="modal-header">
        <span>⚙ Account Settings</span>
        <button class="modal-close" data-close="modal-settings">✕</button>
      </div>
      <div class="modal-body">
        <div class="settings-section">
          <h3>Accounts</h3>
          <div id="settings-account-list"></div>
          <button id="btn-add-account" class="btn-ghost btn-sm">+ Add Account</button>
        </div>
        <div id="account-form-wrap" class="hidden">
          <h3 id="account-form-title">New Account</h3>
          <div class="form-grid">
            <div class="form-group"><label>Label</label><input type="text" id="af-label" placeholder="My Email"></div>
            <div class="form-group"><label>Email</label><input type="text" id="af-email" placeholder="user@example.com"></div>
            <div class="form-group"><label>IMAP Host</label><input type="text" id="af-imap-host"></div>
            <div class="form-group"><label>IMAP Port</label><input type="number" id="af-imap-port" value="993"></div>
            <div class="form-group"><label>SMTP Host</label><input type="text" id="af-smtp-host"></div>
            <div class="form-group"><label>SMTP Port</label><input type="number" id="af-smtp-port" value="465"></div>
            <div class="form-group span-2"><label>Password</label><input type="password" id="af-pass" placeholder="Password (IMAP + SMTP)"></div>
          </div>
          <div class="form-actions">
            <button id="btn-save-account" class="btn-gold">Save Account</button>
            <button id="btn-cancel-account" class="btn-ghost">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="/js/app.js"></script>
</body>
</html>
